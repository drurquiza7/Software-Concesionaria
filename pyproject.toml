[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "software-concesionaria"
version = "0.1.0"
description = "SaaS multi-tenant de gestión de concesionarias automotrices (DMS)"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-ninja>=1.4,<2",
    "celery>=5.5,<6",
    "redis>=5.2,<7",
    "psycopg[binary]>=3.2,<4",
    "cryptography>=44",
    "httpx>=0.28,<1",
    "argon2-cffi>=23.1",
    "gunicorn>=23",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "factory_boy>=3.3",
    "respx>=0.22",
]

# El proyecto no se distribuye como paquete: instalar solo resuelve dependencias.
[tool.setuptools]
py-modules = []

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20", "DJ"]
# DJ001: el SRS define los campos de texto opcionales como NULL.
ignore = ["DJ001"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*" = ["F403", "F405", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "tests"]

[tool.pytest.ini_options]
# --ds gana sobre la variable DJANGO_SETTINGS_MODULE del contenedor.
addopts = "--ds=config.settings.test -ra"
pythonpath = ["."]
testpaths = ["apps", "tests"]
python_files = ["test_*.py"]
